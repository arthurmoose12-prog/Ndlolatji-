<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ndlolatji - Professional maintenance and construction services in Johannesburg and surrounding areas.">
    <title>Ndlolatji | Maintenance & Construction Services</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            color: #222;
            background: #f7f7f7;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 6%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            color: #f4b400;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: #f4b400;
        }

        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, #111 0%, #292929 55%, #444 100%);
            color: white;
        }

        .hero-content {
            max-width: 900px;
        }

        .hero h1 {
            font-size: 58px;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #f4b400;
        }

        .hero h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 19px;
            max-width: 700px;
            margin: 0 auto 30px;
            color: #ddd;
        }

        .btn {
            display: inline-block;
            padding: 14px 25px;
            margin: 7px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primary {
            background: #f4b400;
            color: #111;
        }

        .btn-primary:hover {
            background: #ffd35a;
            transform: translateY(-2px);
        }

        .btn-secondary {
            border: 2px solid white;
            color: white;
        }

        .btn-secondary:hover {
            background: white;
            color: #111;
        }

        section {
            padding: 70px 6%;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-title h2 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .section-title p {
            color: #666;
        }

        .about {
            background: white;
        }

        .about-text {
            max-width: 850px;
            margin: auto;
            text-align: center;
            font-size: 18px;
        }

        .services {
            background: #f1f1f1;
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .service-card {
            background: white;
            padding: 30px 22px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .service-card:hover {
            transform: translateY(-5px);
        }

        .service-icon {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .service-card h3 {
            margin-bottom: 10px;
            font-size: 21px;
        }

        .why {
            background: white;
        }

        .why-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .why-card {
            padding: 25px;
            text-align: center;
            border-left: 4px solid #f4b400;
            background: #fafafa;
        }

        .contact {
            background: #111;
            color: white;
        }

        .contact .section-title p {
            color: #ccc;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            max-width: 900px;
            margin: auto;
        }

        .contact-box {
            background: #222;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        .contact-box h3 {
            color: #f4b400;
            margin-bottom: 10px;
        }

        .contact-box a {
            color: white;
            text-decoration: none;
        }

        footer {
            background: #080808;
            color: #aaa;
            text-align: center;
            padding: 25px 15px;
        }

        footer strong {
            color: #f4b400;
        }

        @media (max-width: 800px) {
            .nav {
                flex-direction: column;
                gap: 12px;
            }

            nav a {
                margin: 0 7px;
                font-size: 14px;
            }

            .hero h1 {
                font-size: 42px;
            }

            .hero h2 {
                font-size: 22px;
            }

            .service-grid,
            .why-grid,
            .contact-grid {
                grid-template-columns: 1fr;
            }

            section {
                padding: 55px 5%;
            }
        }
    </style>
</head>

            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </div>
</header>
